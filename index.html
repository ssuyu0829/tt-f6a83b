<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>讀書時間追蹤</title>
<meta name="theme-color" content="#FAFAF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="讀書追蹤">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF6;
    --grid:#E7E8E0;
    --ink:#22406B;          /* 藍筆 */
    --ink-soft:#5B6B85;
    --red:#C2402F;          /* 紅筆 */
    --hilite:#F9E27A;       /* 螢光筆 */
    --line:#D8DAD0;
    --card:#FFFFFF;
    --serif:"Noto Serif TC",serif;
    --sans:"Noto Sans TC",-apple-system,sans-serif;
    --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);color:var(--ink);
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    min-height:100vh;
    padding:max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}

  header{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 18px}
  header h1{font-family:var(--serif);font-weight:900;font-size:1.15rem;letter-spacing:.08em}
  #updated{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft)}

  /* 倒數：紅筆 */
  .countdown{
    display:flex;align-items:baseline;gap:10px;
    border-top:2px solid var(--red);border-bottom:1px solid var(--red);
    padding:10px 4px;margin-bottom:22px;color:var(--red);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .countdown .label{font-size:.8rem;font-weight:700;letter-spacing:.15em}
  .countdown .days{font-family:var(--serif);font-weight:900;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
  .countdown .unit{font-size:.8rem;font-weight:500}
  .countdown .edit{margin-left:auto;font-size:.68rem;color:var(--red);opacity:.65;border:1px solid currentColor;border-radius:99px;padding:2px 9px}

  /* 主數字：螢光筆畫過 */
  .hero{margin:0 2px 26px}
  .hero .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:6px}
  .hero .big{
    display:inline-block;position:relative;
    font-family:var(--serif);font-weight:900;font-size:4.4rem;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .hero .big::before{
    content:"";position:absolute;z-index:-1;
    left:-6px;right:-10px;top:52%;height:.62em;transform:translateY(-50%) rotate(-1.2deg);
    background:var(--hilite);border-radius:3px 12px 4px 10px;
    transform-origin:left center;
    animation:swipe .55s ease-out .15s both;
  }
  @keyframes swipe{from{transform:translateY(-50%) rotate(-1.2deg) scaleX(0)}to{transform:translateY(-50%) rotate(-1.2deg) scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.hero .big::before{animation:none}}
  .hero .unit{font-family:var(--serif);font-size:1.3rem;font-weight:600;margin-left:4px}
  .hero .sub{margin-top:10px;font-size:.85rem;color:var(--ink-soft)}
  .hero .delta-up{color:#2C6B3F;font-weight:700}
  .hero .delta-down{color:var(--red);font-weight:700}
  .tally{font-family:var(--serif);font-weight:600;letter-spacing:.05em}

  section{margin-bottom:26px}
  h2{
    font-family:var(--serif);font-weight:900;font-size:.95rem;letter-spacing:.12em;
    border-left:4px solid var(--ink);padding-left:9px;margin:0 0 12px 2px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 14px;box-shadow:0 1px 0 var(--line);
  }

  .chart svg{display:block;width:100%;height:auto}

  .cats .row{display:grid;grid-template-columns:4.2em 1fr 3.6em;gap:10px;align-items:center;padding:6px 0}
  .cats .name{font-size:.85rem;font-weight:500}
  .cats .bar{height:12px;border-radius:3px;background:var(--ink);opacity:.9;min-width:2px}
  .cats .row:nth-child(2) .bar{opacity:.72}
  .cats .row:nth-child(3) .bar{opacity:.56}
  .cats .row:nth-child(4) .bar{opacity:.42}
  .cats .row:nth-child(n+5) .bar{opacity:.3}
  .cats .val{font-family:var(--mono);font-size:.74rem;text-align:right;color:var(--ink-soft)}
  .cats .study .bar{background:var(--red);opacity:1}
  .cats .study .name{font-weight:700}

  .sessions .item{
    display:flex;gap:10px;align-items:baseline;
    padding:9px 2px;border-bottom:1px dashed var(--line);font-size:.83rem;
  }
  .sessions .item:last-child{border-bottom:none}
  .sessions time{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
  .sessions .cat{font-weight:700}
  .sessions .dur{margin-left:auto;font-family:var(--mono);font-size:.74rem}
  .sessions .detail{color:var(--ink-soft);font-size:.76rem}

  .note{font-size:.72rem;color:var(--ink-soft);margin-top:10px;line-height:1.6}
  #err{display:none;background:#FBEFEC;border:1px solid var(--red);color:var(--red);
       border-radius:10px;padding:14px;font-size:.85rem;line-height:1.7;margin-bottom:20px}
  footer{margin-top:30px;text-align:center;font-family:var(--mono);font-size:.66rem;color:var(--ink-soft)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>讀書時間追蹤</h1>
    <span id="updated"></span>
  </header>

  <div id="err"></div>

  <div class="countdown" id="countdown" role="button" tabindex="0" aria-label="設定考試日期">
    <span class="label">距離考試</span>
    <span class="days" id="cd-days">—</span>
    <span class="unit">天</span>
    <span class="edit">設定日期</span>
  </div>

  <div class="hero">
    <div class="eyebrow">本週讀書</div>
    <span class="big" id="week-hours">0</span><span class="unit">小時</span>
    <div class="sub" id="week-sub"></div>
  </div>

  <section>
    <h2>每週讀書時數</h2>
    <div class="card chart" id="weekly-chart"></div>
  </section>

  <section>
    <h2>本週時間分配</h2>
    <div class="card cats" id="cat-bars"></div>
  </section>

  <section>
    <h2>最近紀錄</h2>
    <div class="card sessions" id="recent"></div>
    <p class="note">資料每次打開時自動抓取最新的 data.csv;離線時顯示上次快取的版本。異常紀錄(超過 8 小時、start/end 不成對)已自動排除。</p>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const MAX_SESSION_MIN = 8*60;
const $ = id => document.getElementById(id);

/* ---------- 考試日期(儲存在手機本機) ---------- */
function getExamDate(){
  try{ return localStorage.getItem('examDate') || ''; }catch(e){ return ''; }
}
function setExamDate(){
  const cur = getExamDate();
  const v = prompt('考試日期(格式 2027-02-01):', cur || '2027-02-01');
  if(!v) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v.trim())){ alert('格式需為 YYYY-MM-DD'); return; }
  try{ localStorage.setItem('examDate', v.trim()); }catch(e){}
  renderCountdown();
}
function renderCountdown(){
  const d = getExamDate();
  if(!d){ $('cd-days').textContent='—'; return; }
  const days = Math.ceil((new Date(d+'T00:00:00') - new Date())/86400000);
  $('cd-days').textContent = days;
}
$('countdown').addEventListener('click', setExamDate);
$('countdown').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') setExamDate(); });

/* ---------- CSV 解析與清理 ---------- */
function parseCSV(text){
  const rows=[];
  for(const line of text.split(/\r?\n/)){
    if(!line.trim()) continue;
    const c=line.split(',').map(s=>s.trim());
    if(c[0]==='timestamp') continue;
    if(c.length<4) continue;
    const t=new Date(c[0]);
    if(isNaN(t)) continue;
    let cat=c[3]||'其他';
    if(cat.toLowerCase()==='study') cat='讀書';
    rows.push({t, action:c[1], source:c[2], cat, detail:c[4]||''});
  }
  rows.sort((a,b)=>a.t-b.t);
  return rows;
}
function buildSessions(rows){
  const open={}, sessions=[];
  for(const r of rows){
    if(r.action==='start'){ open[r.cat]=r; }          // 重複 start:採用較晚的
    else if(r.action==='end' && open[r.cat]){
      const s=open[r.cat]; delete open[r.cat];
      const min=(r.t-s.t)/60000;
      if(min>0 && min<=MAX_SESSION_MIN)
        sessions.push({start:s.t, end:r.t, cat:r.cat, min, detail:s.detail||r.detail});
    }
  }
  return sessions;
}

/* ---------- 週工具(週一為一週開始) ---------- */
function weekStart(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}
const fmtMD = d => (d.getMonth()+1)+'/'+d.getDate();
const fmtHM = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function fmtDur(min){
  const h=Math.floor(min/60), m=Math.round(min%60);
  return h? h+'h'+(m?String(m).padStart(2,'0'):'') : m+'m';
}
/* 正字記號:每 1 筆讀書 session 一劃 */
function tally(n){
  const full='正'.repeat(Math.floor(n/5));
  const part=['','一','丁','下','正'][n%5]||'';  // 近似筆畫
  return full+part;
}

/* ---------- 畫面 ---------- */
function render(sessions){
  const now=new Date(), thisWk=weekStart(now);

  // 本週
  const inThis = sessions.filter(s=>s.start>=thisWk);
  const study  = inThis.filter(s=>s.cat==='讀書');
  const wkMin  = study.reduce((a,s)=>a+s.min,0);
  $('week-hours').textContent = (wkMin/60).toFixed(1);

  // 上週比較 + 正字
  const lastWk=new Date(thisWk); lastWk.setDate(lastWk.getDate()-7);
  const lastMin = sessions.filter(s=>s.cat==='讀書'&&s.start>=lastWk&&s.start<thisWk)
                          .reduce((a,s)=>a+s.min,0);
  let deltaTxt='';
  if(lastMin>0){
    const diff=(wkMin-lastMin)/60;
    deltaTxt = diff>=0
      ? `較上週 <span class="delta-up">+${diff.toFixed(1)} h</span>`
      : `較上週 <span class="delta-down">${diff.toFixed(1)} h</span>`;
  }
  $('week-sub').innerHTML =
    `${deltaTxt}${deltaTxt?' ・ ':''}本週 ${study.length} 次 <span class="tally">${tally(study.length)}</span>`;

  // 週趨勢(近 8 週)
  const weeks=[];
  for(let i=7;i>=0;i--){
    const ws=new Date(thisWk); ws.setDate(ws.getDate()-7*i);
    const we=new Date(ws); we.setDate(we.getDate()+7);
    const m=sessions.filter(s=>s.cat==='讀書'&&s.start>=ws&&s.start<we)
                    .reduce((a,s)=>a+s.min,0);
    weeks.push({ws, h:m/60});
  }
  drawWeekly(weeks);

  // 本週分配
  const byCat={};
  inThis.forEach(s=>byCat[s.cat]=(byCat[s.cat]||0)+s.min);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxC=cats.length?cats[0][1]:1;
  $('cat-bars').innerHTML = cats.length
    ? cats.map(([c,m])=>`
      <div class="row${c==='讀書'?' study':''}">
        <span class="name">${c}</span>
        <div><div class="bar" style="width:${Math.max(2,(m/maxC*100)).toFixed(1)}%"></div></div>
        <span class="val">${fmtDur(m)}</span>
      </div>`).join('')
    : '<p class="note">本週還沒有紀錄。打開 Notability 開始讀書,或用捷徑補一筆吧。</p>';

  // 最近 12 筆
  $('recent').innerHTML = sessions.slice(-12).reverse().map(s=>`
    <div class="item">
      <time>${fmtMD(s.start)} ${fmtHM(s.start)}</time>
      <span class="cat">${s.cat}</span>
      ${s.detail?`<span class="detail">${s.detail}</span>`:''}
      <span class="dur">${fmtDur(s.min)}</span>
    </div>`).join('');

  const last=sessions[sessions.length-1];
  $('foot').textContent = `共 ${sessions.length} 筆有效紀錄 ・ 最後一筆 ${last?fmtMD(last.end)+' '+fmtHM(last.end):'—'}`;
}

function drawWeekly(weeks){
  const W=520,H=190,pad={t:16,r:8,b:30,l:8};
  const max=Math.max(4,...weeks.map(w=>w.h));
  const bw=(W-pad.l-pad.r)/weeks.length;
  let bars='';
  weeks.forEach((w,i)=>{
    const h=(w.h/max)*(H-pad.t-pad.b);
    const x=pad.l+i*bw+bw*0.18, y=H-pad.b-h;
    const isCur=i===weeks.length-1;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}"
            rx="3" fill="${isCur?'var(--red)':'var(--ink)'}" opacity="${isCur?1:.78}"/>`;
    if(w.h>0)
      bars+=`<text x="${(x+bw*0.32).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle"
             font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--ink-soft)">${w.h.toFixed(1)}</text>`;
    bars+=`<text x="${(x+bw*0.32).toFixed(1)}" y="${H-10}" text-anchor="middle"
           font-size="10.5" font-family="IBM Plex Mono,monospace" fill="var(--ink-soft)">${fmtMD(w.ws)}</text>`;
  });
  $('weekly-chart').innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每週讀書時數長條圖">
       <line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="var(--line)"/>
       ${bars}
     </svg>`;
}

/* ---------- 載入 ---------- */
async function load(){
  try{
    const res=await fetch('data.csv?t='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const sessions=buildSessions(parseCSV(text));
    if(!sessions.length) throw new Error('data.csv 裡沒有可用的紀錄');
    render(sessions);
    $('updated').textContent='更新於 '+fmtHM(new Date());
  }catch(e){
    const el=$('err');
    el.style.display='block';
    el.innerHTML='讀不到 <b>data.csv</b>。請確認它和 index.html 放在同一個 repo 根目錄,'+
                 '而且電腦端的同步腳本有在跑。<br>錯誤訊息:'+e.message;
  }
}
renderCountdown();
load();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
